<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="nav">
            <div class="logo">
                <img src="./logo.png" alt="">
            </div>
            <div class="menu">
                <p class="home">Home</p>
                <p class="aboutus">About Us</p>
                <p class="blogs">Blogs</p>
                <p class="contactus">Contact Us</p>
            </div>
            <button class="getstarted">Get Started</button>
        </div>
        <div class="heading">Heading
            <h1>Insights and Blogs</h1>
        </div>
        <div class="buttons">
            <button class="btn1">All</button>
            <button class="btn2">Tech</button>
            <button class="btn3">SaaS</button>
            <button class="btn4">Marketing</button>
        </div>
        <div class="cards">
            <div class="card1">
                <img src="./glass.png" alt="">

                <div class="card-content">
                    <span>Tech</span>

                    <h2>The Ultimate Guide To SaaS Marketing</h2>

                    <p>May 23, 2025</p>
                </div>
            </div>
            <div class="card2">
                <img src="/chair.png" alt="">

                <div class="card-content">
                    <span>SaaS</span>

                    <h2>5 Key Trends In SaaS Growth For 2025</h2>

                    <p>May 23, 2025</p>
                </div>
            </div>
            <div class="card3">
                <img src="./cat.png" alt="">

                <div class="card-content">
                    <span>Marketing</span>

                    <h2>How Data-Driven <br> Strategies Are Important</h2>

                    <p>May 23, 2025</p>
                </div>
            </div>

</html>
